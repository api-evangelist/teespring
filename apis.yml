aid: teespring
name: Teespring
description: >-
  Teespring is a creator-commerce and print-on-demand platform, founded in 2011,
  that lets creators design, launch, and sell custom apparel and merchandise with
  no upfront cost or inventory, handling production, payment, and fulfillment on
  the creator's behalf. Backed by a16z, the company rebranded to "Spring" in 2021
  and now operates as Amaze Commerce (part of Amaze Holdings): its consumer
  storefront lives at spri.ng while the creator/merchant SaaS platform runs at
  amazecommerce.com and amaze.co. As of this enrichment pass the company exposes
  no public developer API, developer portal, OpenAPI/AsyncAPI specification,
  /.well-known discovery surface, or llms.txt; this profile therefore captures
  verified company identity and published site properties only.
